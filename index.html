<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zombie Escape</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#111;font-family:Arial}canvas{display:block}#hud{position:fixed;top:14px;left:18px;color:#fff;font-size:19px;font-weight:bold;text-shadow:2px 2px 4px #000;z-index:2}.panel{background:#18232e;border:2px solid #607080;border-radius:14px;padding:25px;min-width:420px;max-width:92vw;box-shadow:0 10px 40px #000;text-align:center}.panel h1{font-size:42px;margin:0 0 8px}.panel p{color:#ccd5dc}.menuBtn,.opt{font-size:19px;padding:11px 18px;margin:6px;border:1px solid #71808c;border-radius:8px;background:#263746;color:#fff;cursor:pointer}.selected{outline:3px solid #55c7ff}.hidden{display:none!important}#message{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,7,11,.86);color:#fff;z-index:3}.nuke{font-size:80px;animation:boom 1.5s ease-in-out}@keyframes boom{0%{transform:scale(.2);opacity:0}45%{transform:scale(1.2);opacity:1}100%{transform:scale(2);opacity:0}}</style></head><body><canvas id="game"></canvas><div id="hud"></div><div id="message"><div class="panel" id="menu"><h1>🧟 ZOMBIE ESCAPE</h1><p>Wybierz tryb gry</p><button class="menuBtn" id="classic">1. CLASSIC</button><p>Pełna wersja: ruch, skok, pistolet, wieżyczki i światy.</p><button class="menuBtn" id="custom">2. NIESTANDARDOWY</button><button class="menuBtn" id="record">🌍 GLOBALNY REKORD</button></div><div class="panel hidden" id="customPanel"><h1>⚙️ NIESTANDARDOWY</h1><p>Sterowanie</p><button class="opt selected" id="lr">← LEWO / → PRAWO</button><button class="opt" id="up">↑ GÓRA = SKOK</button><p>Obrona</p><button class="opt selected" id="turret">🤖 WIEŻYCZKA: WŁĄCZ</button><button class="opt selected" id="gun">🔫 PISTOLET: WŁĄCZ</button><br><button class="menuBtn" id="customStart">START</button><button class="menuBtn" id="back">WRÓĆ</button></div><div class="panel hidden" id="info"><h1>🌍 GLOBALNY REKORD</h1><p id="recordText">Ładowanie...</p><button class="menuBtn" id="back2">WRÓĆ</button></div><div class="panel hidden" id="transition"><div class="nuke">☢️</div><h1>ATOMÓWKA!</h1><p id="transitionText">Świat zostaje zniszczony...</p></div><div class="panel hidden" id="gameover"><h1>💀 KONIEC GRY</h1><p id="result"></p><input id="playerName" maxlength="16" placeholder="Twój nick" style="font-size:18px;padding:10px;width:220px"><br><button class="menuBtn" id="submit">🏆 ZAPISZ WYNIK</button><button class="menuBtn" id="again">MENU</button></div></div><script>const c=document.getElementById('game'),x=c.getContext('2d'),hud=document.getElementById('hud'),msg=document.getElementById('message');let W,H,ground,p,z,bullets,picks,turrets,score,kills,stage,ammo,best=+localStorage.zbest||0,running=false,vy=0,speed=5,down=false,last=0,spawnT=0,pickT=100,shotCD=0,mouse=false,keys={},settings={move:'lr',turret:true,gun:true};function resize(){W=c.width=innerWidth;H=c.height=innerHeight;ground=H-105}addEventListener('resize',resize);resize();function show(id){document.querySelectorAll('.panel').forEach(e=>e.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}function menu(){msg.style.display='flex';show('menu')}classic.onclick=()=>start(true);custom.onclick=()=>show('customPanel');back.onclick=menu;back2.onclick=menu;again.onclick=menu;record.onclick=loadLeaderboard;lr.onclick=()=>{settings.move='lr';lr.classList.add('selected');up.classList.remove('selected')};up.onclick=()=>{settings.move='up';up.classList.add('selected');lr.classList.remove('selected')};turret.onclick=()=>{settings.turret=!settings.turret;turret.textContent='🤖 WIEŻYCZKA: '+(settings.turret?'WŁĄCZ':'WYŁĄCZ');turret.classList.toggle('selected',settings.turret)};gun.onclick=()=>{settings.gun=!settings.gun;gun.textContent='🔫 PISTOLET: '+(settings.gun?'WŁĄCZ':'WYŁĄCZ');gun.classList.toggle('selected',settings.gun)};customStart.onclick=()=>start(false);async function loadLeaderboard(){show('info');recordText.textContent='Ładowanie globalnej tabeli...';try{let r=await fetch('/api/leaderboard');if(!r.ok)throw 0;let a=await r.json();recordText.innerHTML=a.length?a.map((v,i)=>(i+1)+'. <b>'+v.name+'</b>  '+v.score+' pkt').join('<br>'):'Brak wyników';}catch(e){recordText.innerHTML='Globalny ranking wymaga konfiguracji bazy na Vercelu.<br><br>Twój rekord lokalny: <b>'+best+'</b>';}}async function saveScore(){let name=(playerName.value||'Gracz').trim();try{await fetch('/api/leaderboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,score:Math.floor(score)})});submit.textContent='✅ ZAPISANO';}catch(e){submit.textContent='❌ BŁĄD';}}submit.onclick=saveScore;function start(classicMode){if(classicMode)settings={move:'lr',turret:true,gun:true};p={x:140,y:ground-68,w:44,h:68};z=[];bullets=[];picks=[];turrets=[];score=0;kills=0;stage=1;ammo=12;speed=5;vy=0;shotCD=0;running=true;last=0;spawnT=20;pickT=100;msg.style.display='none';requestAnimationFrame(loop)}function jump(){if(running&&p.y>=ground-p.h-1)vy=-14}function shoot(){if(!running||!settings.gun||ammo<=0||shotCD>0)return;ammo--;shotCD=10;bullets.push({x:p.x+p.w,y:p.y+28,vx:14,vy:0})}function placeTurret(){if(!running||!settings.turret||ammo<5)return;ammo-=5;turrets.push({x:p.x+55,y:ground-48,life:1800,cd:5})}addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'||(settings.move==='up'&&e.code==='ArrowUp')){e.preventDefault();jump()}if(e.code==='ArrowDown')down=true;if(e.code==='KeyR'&&running)ammo=12;if(e.code==='KeyT'&&running)placeTurret()});addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='ArrowDown')down=false});addEventListener('mousedown',e=>{if(e.button===0){mouse=true;shoot()}});addEventListener('mouseup',e=>{if(e.button===0)mouse=false});function spawn(){let h=48+Math.random()*18;z.push({x:W+40,y:ground-h,w:42,h,hp:1+2*(stage-1)})}function spawnPick(){picks.push({x:W+30,y:ground-70,w:34,h:34})}function nextStage(){running=false;msg.style.display='flex';show('transition');transitionText.textContent='Świat '+stage+' został zniszczony. Pokonano '+(stage*10)+' zombie. Następny świat: '+(stage+1);setTimeout(()=>{stage++;speed+=.8;z=[];turrets=[];msg.style.display='none';running=true;last=0;requestAnimationFrame(loop)},1800)}function gameover(){running=false;best=Math.max(best,Math.floor(score));localStorage.zbest=best;result.textContent='Wynik: '+Math.floor(score)+' | Świat: '+stage+' | Rekord lokalny: '+best;msg.style.display='flex';show('gameover')}function loop(t=0){if(!running)return;let dt=Math.min(2,(t-last)/16||1);last=t;shotCD=Math.max(0,shotCD-dt);if(mouse)shoot();let mv=7*dt;if(keys.KeyA||keys.ArrowLeft)p.x=Math.max(10,p.x-mv);if(keys.KeyD||keys.ArrowRight)p.x=Math.min(W*.55,p.x+mv);vy+=.72*dt;p.y+=vy*dt;if(p.y>ground-p.h)p.y=ground-p.h,vy=0;spawnT-=dt;pickT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(24,58-stage*4)+Math.random()*55}if(pickT<=0){spawnPick();pickT=170+Math.random()*160}speed+=.0012*dt;z.forEach(q=>q.x-=speed*dt);picks.forEach(a=>a.x-=speed*dt);turrets.forEach(q=>{q.life-=dt;q.cd-=dt;if(q.cd<=0){q.cd=35;let target=z.find(a=>a.x>q.x);if(target){let dx=target.x-q.x,dy=target.y-q.y,len=Math.hypot(dx,dy)||1;bullets.push({x:q.x+30,y:q.y+5,vx:14*dx/len,vy:14*dy/len})}}});turrets=turrets.filter(q=>q.life>0);bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});for(let i=bullets.length-1;i>=0;i--){let b=bullets[i],hit=false;for(let j=z.length-1;j>=0;j--){let q=z[j];if(b.x>q.x&&b.x<q.x+q.w&&b.y>q.y&&b.y<q.y+q.h){q.hp--;bullets.splice(i,1);if(q.hp<=0){z.splice(j,1);score+=5;kills++;if(kills>=stage*10){nextStage();return}}hit=true;break}}if(!hit&&(b.x>W||b.y<0||b.y>H))bullets.splice(i,1)}for(let i=picks.length-1;i>=0;i--){let a=picks[i],ph=down?38:p.h,py=down?ground-38:p.y;if(p.x<a.x+a.w&&p.x+p.w>a.x&&py<a.y+a.h&&py+ph>a.y){ammo=Math.min(30,ammo+6);picks.splice(i,1);score+=2}}z=z.filter(q=>q.x>-80);picks=picks.filter(q=>q.x>-80);for(const q of z){let ph=down?38:p.h,py=down?ground-38:p.y;if(p.x<q.x+q.w&&p.x+p.w>q.x&&py<q.y+q.h&&py+ph>q.y)return gameover()}hud.innerHTML='❤️ 3　🏆 '+Math.floor(score)+'　🏅 '+best+'　🔫 '+ammo+'　🌍 ŚWIAT '+stage+'　☠️ '+kills+'/'+stage*10+'　🧟 HP '+(1+2*(stage-1))+'　🤖 '+turrets.length;draw();requestAnimationFrame(loop)}function draw(){x.clearRect(0,0,W,H);let worlds=[{a:'#17212b',b:'#3b4650',g:'#252832'},{a:'#071d32',b:'#176b78',g:'#102b38'},{a:'#260b35',b:'#9b2674',g:'#32102d'},{a:'#3d1708',b:'#d46a1d',g:'#4b2110'},{a:'#071007',b:'#274d25',g:'#142414'},{a:'#eee',b:'#8a9aa8',g:'#d8dde2'}];let w=worlds[(stage-1)%worlds.length],g=x.createLinearGradient(0,0,0,ground);g.addColorStop(0,w.a);g.addColorStop(1,w.b);x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle=w.g;x.fillRect(0,ground,W,H-ground);x.fillStyle='#69737b';x.fillRect(0,ground,W,5);for(let i=0;i<12;i++){let bx=i*150+30;x.fillStyle=w.g;x.fillRect(bx,ground-80-(i%3)*45,90,80+(i%3)*45);x.fillStyle='#e0b63f';for(let j=0;j<3;j++)x.fillRect(bx+15+j*23,ground-60-(i%3)*45,10,15)}x.font='54px Arial';x.save();x.scale(-1,1);x.fillText('🏃',-p.x-p.w,p.y+p.h);x.restore();z.forEach(q=>{x.fillText('🧟',q.x,q.y+q.h);x.font='14px Arial';x.fillStyle='#e33';x.fillRect(q.x,q.y-8,q.w,4);x.fillStyle='#4f4';x.fillRect(q.x,q.y-8,q.w*(q.hp/(1+2*(stage-1))),4);x.font='54px Arial'});x.font='36px Arial';picks.forEach(a=>x.fillText('📦',a.x,a.y+a.h));turrets.forEach(q=>x.fillText('🤖',q.x,q.y+35));x.fillStyle='#ffd34d';bullets.forEach(b=>{x.beginPath();x.arc(b.x,b.y,5,0,Math.PI*2);x.fill()})}menu();</script></body></html>
