<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zombie Escape</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#18212b;font-family:Arial}canvas{display:block}#hud{position:fixed;top:14px;left:18px;color:#fff;font-size:20px;font-weight:bold;text-shadow:2px 2px 4px #000;z-index:2}#message{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,8,12,.78);color:white;z-index:3}#message h1{font-size:48px;margin:0 0 10px}#message p{font-size:18px}button{font-size:24px;padding:12px 38px;cursor:pointer;border:2px solid #fff;border-radius:8px;background:#263544;color:#fff}</style></head><body><canvas id="game"></canvas><div id="hud">❤️ <span id="hp">3</span>　🏆 <span id="score">0</span>　🏅 <span id="best">0</span>　🔫 <span id="ammo">12</span>　🏚️ ETAP <span id="stage">1</span></div><div id="message"><h1>🧟 ZOMBIE ESCAPE</h1><p>A/D = RUCH　SPACJA = SKOK　↓ = SCHYLENIE　LPM = STRZAŁ　R = PRZEŁADOWANIE　T = WIEŻYCZKA</p><button id="start">START</button></div><script>const c=document.getElementById('game'),x=c.getContext('2d');let W,H,p,z,bullets,ammoPickups,turrets,score,best=+localStorage.zbest||0,running=false,vy=0,ground=0,speed=5,down=false,last=0,spawnT=0,pickT=120,turretT=0,ammo=12,stage=1,kills=0,keys={};function resize(){W=c.width=innerWidth;H=c.height=innerHeight;ground=H-105}addEventListener('resize',resize);resize();document.getElementById('best').textContent=best;addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();jump()}if(e.code==='ArrowDown')down=true;if(e.code==='KeyR'&&running){ammo=12;document.getElementById('ammo').textContent=ammo}if(e.code==='KeyT'&&running&&ammo>=5){ammo-=5;turrets.push({x:p.x+55,y:ground-48,life:900,cd:0});document.getElementById('ammo').textContent=ammo}});addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='ArrowDown')down=false});addEventListener('mousedown',shoot);document.getElementById('start').onclick=reset;function reset(){p={x:140,y:ground-68,w:44,h:68};z=[];bullets=[];ammoPickups=[];turrets=[];score=0;kills=0;stage=1;speed=5;vy=0;ammo=12;running=true;document.getElementById('stage').textContent=stage;document.getElementById('ammo').textContent=ammo;document.getElementById('message').style.display='none';last=0;spawnT=30;pickT=100;turretT=0;requestAnimationFrame(loop)}function jump(){if(running&&p.y>=ground-p.h-1)vy=-14}function shoot(){if(!running||ammo<=0)return;ammo--;document.getElementById('ammo').textContent=ammo;bullets.push({x:p.x+p.w,y:p.y+28,v:13})}function spawn(){let h=48+Math.random()*18;z.push({x:W+40,y:ground-h,w:42,h,hp:1})}function spawnAmmo(){ammoPickups.push({x:W+30,y:ground-70,w:34,h:34})}function turretShoot(t){if(t.cd>0)return;t.cd=35;let target=z.find(q=>q.x>t.x&&q.x<W);if(target)bullets.push({x:t.x+30,y:t.y+5,v:14,turret:true})}function loop(t=0){if(!running)return;let dt=Math.min(2,(t-last)/16||1);last=t;let move=7*dt;if(keys.KeyA||keys.ArrowLeft)p.x=Math.max(10,p.x-move);if(keys.KeyD||keys.ArrowRight)p.x=Math.min(W*.55,p.x+move);vy+=.72*dt;p.y+=vy*dt;if(p.y>ground-p.h)p.y=ground-p.h,vy=0;spawnT-=dt;pickT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(25,55-stage*3)+Math.random()*65}if(pickT<=0){spawnAmmo();pickT=180+Math.random()*180}speed+=.0012*dt;z.forEach(q=>q.x-=speed*dt);ammoPickups.forEach(a=>a.x-=speed*dt);turrets.forEach(t=>{t.life-=dt;t.cd-=dt;turretShoot(t)});turrets=turrets.filter(t=>t.life>0);bullets.forEach(b=>b.x+=b.v*dt);for(let i=bullets.length-1;i>=0;i--){let b=bullets[i],hit=false;for(let j=z.length-1;j>=0;j--){let q=z[j];if(b.x>q.x&&b.x<q.x+q.w&&b.y>q.y&&b.y<q.y+q.h){z.splice(j,1);bullets.splice(i,1);score+=5;kills++;if(kills%10===0){stage++;speed+=.6;document.getElementById('stage').textContent=stage}hit=true;break}}if(!hit&&b.x>W)bullets.splice(i,1)}for(let i=ammoPickups.length-1;i>=0;i--){let a=ammoPickups[i];let ph=down?38:p.h,py=down?ground-38:p.y;if(p.x<a.x+a.w&&p.x+p.w>a.x&&py<a.y+a.h&&py+ph>a.y){ammo=Math.min(30,ammo+6);document.getElementById('ammo').textContent=ammo;ammoPickups.splice(i,1);score+=2}}z=z.filter(q=>q.x>-80);ammoPickups=ammoPickups.filter(a=>a.x>-80);for(const q of z){let ph=down?38:p.h,py=down?ground-38:p.y;if(p.x<q.x+q.w&&p.x+p.w>q.x&&py<q.y+q.h&&py+ph>q.y){running=false;document.getElementById('message').style.display='flex';document.querySelector('#message h1').textContent='💀 KONIEC GRY';document.querySelector('#message p').textContent='Wynik: '+Math.floor(score)+' | Etap '+stage;best=Math.max(best,Math.floor(score));localStorage.zbest=best;document.getElementById('best').textContent=best;return}}score+=dt/12;document.getElementById('score').textContent=Math.floor(score);draw();requestAnimationFrame(loop)}function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,ground);g.addColorStop(0,'#17212b');g.addColorStop(1,'#3b4650');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#22272d';x.fillRect(0,ground,W,H-ground);x.fillStyle='#59636b';x.fillRect(0,ground,W,5);for(let i=0;i<12;i++){let bx=i*150+30;x.fillStyle='#252d35';x.fillRect(bx,ground-80-(i%3)*45,90,80+(i%3)*45);x.fillStyle='#d5a93a';for(let j=0;j<3;j++)x.fillRect(bx+15+j*23,ground-60-(i%3)*45,10,15)}x.font='54px Arial';x.save();x.scale(-1,1);x.fillText('🏃',-p.x-p.w,p.y+p.h);x.restore();z.forEach(q=>{x.font='52px Arial';x.fillText('🧟',q.x,q.y+q.h)});x.font='36px Arial';ammoPickups.forEach(a=>x.fillText('📦',a.x,a.y+a.h));turrets.forEach(t=>{x.font='38px Arial';x.fillText('🤖',t.x,t.y+35)});x.fillStyle='#ffd34d';bullets.forEach(b=>{x.beginPath();x.arc(b.x,b.y,5,0,Math.PI*2);x.fill()})}</script></body></html>
