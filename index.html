<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zombie Escape</title><style>html,body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial}canvas{display:block}#hud{position:fixed;top:15px;left:15px;color:white;font-size:20px;font-weight:bold;text-shadow:2px 2px #000;z-index:2}#message{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111d;color:white;z-index:3}button{font-size:24px;padding:12px 35px;cursor:pointer;border:0;border-radius:10px}#game{position:fixed;inset:0}</style></head><body><canvas id="game"></canvas><div id="hud">❤️ <span id="hp">3</span>　🏆 <span id="score">0</span>　🏅 Rekord: <span id="best">0</span></div><div id="message"><h1>🧟 ZOMBIE ESCAPE</h1><p>SPACJA = SKOK　↓ = SCHYLENIE</p><button id="start">START</button></div><script>const c=document.getElementById('game'),x=c.getContext('2d');let W,H,p,z,score,best=+localStorage.zbest||0,running=false,vy=0,ground=0,speed=6,down=false;function resize(){W=c.width=innerWidth;H=c.height=innerHeight;ground=H-100}addEventListener('resize',resize);resize();document.getElementById('best').textContent=best;function reset(){p={x:100,y:ground-60,w:45,h:60};z=[];score=0;speed=6;vy=0;running=true;document.getElementById('message').style.display='none';last=0;spawnT=20;requestAnimationFrame(loop)}function jump(){if(running&&p.y>=ground-p.h-1)vy=-14}addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump()}if(e.code==='ArrowDown')down=true});addEventListener('keyup',e=>{if(e.code==='ArrowDown')down=false});document.getElementById('start').onclick=reset;let last=0,spawnT=0;function spawn(){z.push({x:W+30,y:ground-55,w:40,h:55})}function loop(t=0){if(!running)return;let dt=Math.min(2,(t-last)/16||1);last=t;vy+=.7*dt;p.y+=vy*dt;if(p.y>ground-p.h)p.y=ground-p.h,vy=0;spawnT-=dt;if(spawnT<=0){spawn();spawnT=50+Math.random()*70}speed+=.001*dt;z.forEach(q=>q.x-=speed*dt);z=z.filter(q=>q.x>-60);for(const q of z){let ph=down?35:p.h,py=down?ground-35:p.y;if(p.x<q.x+q.w&&p.x+p.w>q.x&&py<q.y+q.h&&py+ph>q.y){running=false;document.getElementById('message').style.display='flex';document.querySelector('#message h1').textContent='💀 KONIEC GRY';document.querySelector('#message p').textContent='Wynik: '+Math.floor(score);best=Math.max(best,Math.floor(score));localStorage.zbest=best;document.getElementById('best').textContent=best;return}}score+=dt/10;document.getElementById('score').textContent=Math.floor(score);draw();requestAnimationFrame(loop)}function draw(){x.clearRect(0,0,W,H);x.fillStyle='#87ceeb';x.fillRect(0,0,W,H);x.fillStyle='#65a84b';x.fillRect(0,ground,W,H-ground);x.fillStyle='#333';x.fillRect(0,ground,W,5);x.font='50px Arial';x.fillText('🏃',p.x,p.y+p.h);z.forEach(q=>x.fillText('🧟',q.x,q.y+q.h));x.font='40px Arial';x.fillText('☁️',W*.2,100);x.fillText('☁️',W*.7,150)}</script></body></html>
